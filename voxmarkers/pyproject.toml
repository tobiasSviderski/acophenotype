[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxmarkers"
dynamic = ["version"]
description = "Interpretable acoustic biomarkers of speech for neurodegenerative-disease research"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Marek Svidersky" },
]
keywords = [
    "speech",
    "acoustics",
    "biomarkers",
    "dementia",
    "alzheimer",
    "prosody",
    "voice-quality",
    "digital-biomarkers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "librosa>=0.10",
    "praat-parselmouth>=0.4",
    "antropy>=0.1.4",
    "PyWavelets>=1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "soundfile>=0.12",
]
dev = [
    "pytest>=7.0",
    "soundfile>=0.12",
    "ruff>=0.4",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/msvidersky/acophenotype"
Source = "https://github.com/msvidersky/acophenotype/tree/main/voxmarkers"
Issues = "https://github.com/msvidersky/acophenotype/issues"
Models = "https://huggingface.co/msvidersky/acophenotype-pitt-models"

[project.scripts]
voxmarkers = "voxmarkers.cli:main"

[tool.hatch.version]
path = "src/voxmarkers/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/voxmarkers"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
