[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acophen-fusion"
dynamic = ["version"]
description = "Late/early fusion scorer for acoustic phenotyping streams (research use)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Marek Sviderski" },
]
keywords = [
    "speech", "acoustics", "fusion", "dementia", "alzheimer",
    "zero-shot", "digital-biomarkers", "stacking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    # The frozen models were pickled with scikit-learn 1.7.2. Stacking and SGL are now
    # applied version-independently, but the FC2FS pipeline and per-stream models are
    # still sklearn pickles, so stay on the 1.7 series until they are re-exported.
    "scikit-learn>=1.7.2,<1.8",
    "joblib>=1.1",
    "lightgbm>=3.3",
    "xgboost>=1.6",            # the binary SSL/embeddings stream model is an XGBClassifier
    "huggingface_hub>=0.30",   # automatic weight download on first use
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.4", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/tobiasSviderski/acophenotype"
Source = "https://github.com/tobiasSviderski/acophenotype/tree/main/acophen-fusion"
Issues = "https://github.com/tobiasSviderski/acophenotype/issues"
Models = "https://huggingface.co/sivdma/acophenotype-pitt-models"

[project.scripts]
acophen-fusion = "acophen_fusion.cli:main"

[tool.hatch.version]
path = "src/acophen_fusion/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acophen_fusion"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
