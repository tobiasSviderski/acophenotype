name: Publish to PyPI

# Runs when a GitHub Release is published. Builds all four packages, then uploads each
# one to PyPI via Trusted Publishing (no passwords or API tokens stored anywhere).
#
# Each package publishes from its OWN GitHub environment (pypi-<package>). PyPI requires
# every pending trusted publisher to have a unique repository + workflow + environment
# combination, so four packages from one repository need four environment names.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build all four packages
        run: |
          pip install build
          for p in voxmarkers acophen-fusion acophen-streams acophenotype; do
            python -m build "$p" --outdir "dist/$p"
          done
          ls -lR dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1   # dependencies first: voxmarkers, fusion, streams, then umbrella
      matrix:
        package: [voxmarkers, acophen-fusion, acophen-streams, acophenotype]
    environment: pypi-${{ matrix.package }}   # must match the environment on PyPI
    permissions:
      id-token: write                         # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.package }}/
