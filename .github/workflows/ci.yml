name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package: [voxmarkers, acophen-fusion, acophen-streams, acophenotype]
    env:
      # No model weights in CI: tests that need them skip themselves.
      ACOPHEN_NO_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 libgomp1
      - name: CPU-only torch (avoids multi-GB CUDA wheels)
        run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install the suite from this repository
        run: |
          python -m pip install --upgrade pip
          pip install -e ./voxmarkers -e ./acophen-fusion -e "./acophen-streams[all]" -e ./acophenotype
          pip install pytest soundfile
      - name: Test ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        run: pytest -q
